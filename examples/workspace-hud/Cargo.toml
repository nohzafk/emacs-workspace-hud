[package]
name = "workspace-hud"
version = "0.1.0"
edition = "2021"
description = "Flagship demo for emacs-egui-panel: a workspace-status card rendered with egui/WASM."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "serde",
] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "HtmlCanvasElement", "Document", "Element"] }
lazy_static = "1.4"
console_error_panic_hook = "0.1"
