[package]
name = "workspace-hud"
version = "0.1.0"
edition = "2021"
description = "Flagship demo for emacs-egui-panel: a workspace-status card rendered with egui/WASM."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
emacs-egui-sdk = { path = "../emacs-egui/sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow"] }
